[project]
name = "cce"
version = "0.1.0"
description = "Cut Cross Entropy implemented in Triton"
readme = "README.md"
requires-python = ">=3.10"
license= {text = "MIT"}

dependencies = [
    "triton>=3.0.0",
    "torch >= 2.0.0"
]


[project.optional-dependencies]
dev = [
    "ruff>=0.15.14",
]
training = [
    "fire>=0.7.1",
    "modal>=1.3.5",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cce"]

